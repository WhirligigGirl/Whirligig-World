		{
			description = The discovery of Digress caused quite a stir in the scientific community. Being discovered after the planet known today as Mandrake but before Rutherford, Digress was the second of Gememma's planets known to astronomy. The discovery of yet another giant planet around Gememma was unexpected, even Mandrake was spuriously observed throughout antiquity, yet Digress being closer to Gememma allowed it to remain better hidden.\n\n Digress was discovered by Gildmore Mesmaning, an elder astronomer who usually spent his time observing and recording nebulae, and originally recorded Digress as a planetary nebula (briefly cataloging it Gildmore 17), repeat observations however confirmed it was moving alongside Gememma through the sky. Being his first major discovery in the field of planetary astronomy, Gildmore wrote an extremely extensive letter detailing the progression of its discovery and his intital suspicions on the planets nature (including speculation that it may be oblate like Mesbin, potentially due to just barely observing its ring system, though this is debated) and sent it to the Mesbin Astronomical Society. After dermonths of silence, and fearing his discovery may be stolen by another, a followup letter was sent asking if the Society had indeed recieved his letter and when they would announce the discovery of his planet. The Astronomical Society had no record of the original letter, at which point they realized it had been accidently discarded in their mail room. Not willing to admit to their mistake, they dug through hundreds of shreds of paper to find any remaining scrap. They turned up one single tattered with the words "I digress" written on them. This piece would be mailed back to Gildmore with a formal apology, explaining their situation. Gildmore recounts the experience as initially frustrating, but quite funny in retrospect. "These things do tend to happen when dealing with such volumes of paperwork," he remarked in an interview, "I hold no grudge, but think the planet's permanent name serves a remarkable reminder of the story, and provides more than enough encouragement to the Society to not make that mistake again. Digress is quite similar to what I was going to name it originally, but I will keep that old name hidden in the shreads of the my original letter."\nBut I digress.
